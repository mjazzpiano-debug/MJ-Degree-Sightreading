<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ffffff">

<title>MJ 도수 초견 트레이너</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f7f7f7;
  color:#111;
  font-family:Arial,"Noto Sans KR",sans-serif;
}

.wrap{
  max-width:900px;
  margin:0 auto;
  padding:28px 18px 40px;
}

h1{
  font-size:28px;
  margin:0 0 6px;
  font-weight:800;
}

.sub{
  color:#666;
  margin-bottom:24px;
}

.panel{
  background:#fff;
  border:1px solid #ddd;
  border-radius:18px;
  padding:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.04);
}

.controls{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:18px;
}

label{
  font-size:13px;
  color:#666;
  display:block;
  margin-bottom:6px;
}

select,
input[type=number]{
  width:100%;
  height:44px;
  border:1px solid #ccc;
  border-radius:10px;
  padding:0 12px;
  background:#fff;
  font:inherit;
}

button{
  border:0;
  border-radius:11px;
  height:46px;
  padding:0 18px;
  font:inherit;
  font-weight:700;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}

.primary{
  background:#111;
  color:#fff;
}

.secondary{
  background:#eee;
  color:#111;
}

.keyline{
  text-align:center;
  margin:10px 0 16px;
}

.key{
  font-size:22px;
  font-weight:800;
}

.status{
  text-align:center;
  color:#666;
  min-height:24px;
  font-size:14px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin:18px 0;
}

.bar{
  height:150px;
  background:#fafafa;
  border:1px solid #d8d8d8;
  border-radius:12px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
}

.bar:before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:4px;
  background:#111;
}

.num{
  position:absolute;
  top:10px;
  left:14px;
  font-size:12px;
  color:#999;
}

.chord{
  font-size:27px;
  font-weight:800;
  letter-spacing:-.5px;
}

.hidden .chord{
  visibility:hidden;
}

.hidden .bar{
  background:#eee;
}

.hidden .bar:before{
  background:#bbb;
}

.hidden .num{
  visibility:hidden;
}

.actions{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
}

.big{
  min-width:180px;
}

.metronome{
  margin-top:18px;
  padding-top:18px;
  border-top:1px solid #eee;
  text-align:center;
}

.beat{
  font-size:30px;
  font-weight:800;
  letter-spacing:8px;
  margin:8px 0 12px;
  min-height:38px;
}

.beat span{
  opacity:.18;
}

.beat span.active{
  opacity:1;
}

.count{
  font-size:48px;
  font-weight:900;
  text-align:center;
  height:58px;
  line-height:58px;
}

.note{
  font-size:13px;
  color:#777;
  line-height:1.6;
  margin-top:14px;
}

@media(max-width:650px){

  .wrap{
    padding:20px 12px 30px;
  }

  h1{
    font-size:23px;
  }

  .controls{
    grid-template-columns:1fr 1fr;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
  }

  .bar{
    height:125px;
  }

  .chord{
    font-size:22px;
  }

  .actions button{
    width:100%;
  }

  .big{
    min-width:0;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <h1>MJ 도수 초견 트레이너</h1>

  <div class="sub">
    랜덤 4마디 · 5~60초 암기 · 도수 숨김 · 메트로놈 연주
  </div>

  <div class="panel">

    <div class="controls">

      <div>
        <label>난이도</label>

        <select id="level">
          <option value="basic">중급</option>
          <option value="advanced" selected>중상급</option>
          <option value="hard">상급</option>
        </select>
      </div>

      <div>
        <label>템포 (BPM)</label>

        <input
          id="tempo"
          type="number"
          min="40"
          max="220"
          value="100"
        >
      </div>

      <div>
        <label>암기 시간</label>

        <select id="seconds">

          <option value="5">5초</option>
          <option value="10" selected>10초</option>
          <option value="15">15초</option>
          <option value="20">20초</option>
          <option value="25">25초</option>
          <option value="30">30초</option>
          <option value="35">35초</option>
          <option value="40">40초</option>
          <option value="45">45초</option>
          <option value="50">50초</option>
          <option value="55">55초</option>
          <option value="60">60초</option>

        </select>
      </div>

      <div>

        <label>키</label>

        <select id="keyMode">

          <option value="random" selected>
            랜덤 12키
          </option>

          <option value="fixed">
            직접 선택
          </option>

        </select>

        <select
          id="fixedKey"
          style="display:none;margin-top:6px"
        >

          <option>Bb</option>
          <option>C</option>
          <option>Db</option>
          <option>D</option>
          <option>Eb</option>
          <option>E</option>
          <option>F</option>
          <option>Gb</option>
          <option>G</option>
          <option>Ab</option>
          <option>A</option>
          <option>B</option>

        </select>

      </div>

    </div>

    <div class="keyline">
      KEY <span class="key" id="key">Bb</span>
    </div>

    <div class="status" id="status">
      새로운 진행을 생성하세요.
    </div>

    <div class="count" id="count"></div>

    <div class="grid" id="grid"></div>

    <div class="actions">

      <button
        class="primary big"
        id="start"
      >
        새 문제 + 카운트
      </button>

      <button
        class="secondary big"
        id="show"
      >
        도수 다시 보기
      </button>

      <button
        class="secondary"
        id="tempoMinus"
      >
        BPM −5
      </button>

      <button
        class="secondary"
        id="tempoPlus"
      >
        BPM +5
      </button>

    </div>

    <div class="metronome">

      <div style="font-weight:700">
        METRONOME
      </div>

      <div
        class="beat"
        id="beats"
      >
        <span>1</span>
        <span>2</span>
        <span>3</span>
        <span>4</span>
      </div>

      <button
        class="primary"
        id="metro"
      >
        메트로놈 시작
      </button>

    </div>

    <div class="note">

      • 문제를 생성하면 설정한 암기 시간 동안 4마디 도수를 확인합니다.<br>
      • 카운트가 끝나면 도수가 자동으로 사라집니다.<br>
      • 이후 메트로놈이 자동으로 시작되어 연주할 수 있습니다.<br>
      • 메트로놈은 별도의 음원 파일 없이 브라우저에서 직접 생성됩니다.

    </div>

  </div>

</div>


<script>

/* =========================================================
   기본 데이터
========================================================= */

const keys = [
  "C","Db","D","Eb","E","F",
  "Gb","G","Ab","A","Bb","B"
];


const pools = {

  basic:[
    "I",
    "IIM7",
    "IIm7",
    "III7",
    "IIIm7",
    "IVM7",
    "V7",
    "VIm7",
    "VIIø7",
    "bVIIM7"
  ],

  advanced:[
    "I",
    "IM7",
    "IIm7",
    "II7",
    "IIIM7",
    "III7",
    "IVM7",
    "IVm7",
    "V7",
    "VIm7",
    "VI7",
    "VIIø7",
    "bII7",
    "bVIIM7",
    "bVI7",
    "bVII7",
    "bIII7"
  ],

  hard:[
    "I",
    "IM7",
    "IIm7",
    "II7",
    "IIø7",
    "IIIM7",
    "III7",
    "IVM7",
    "IVm7",
    "IV7",
    "V7",
    "V7(b9)",
    "V7(#9)",
    "VIm7",
    "VI7",
    "VIIø7",
    "bII7",
    "bIIIM7",
    "bVI7",
    "bVIIM7",
    "bVII7",
    "bVIIIM7"
  ]

};


/* =========================================================
   상태값
========================================================= */

let current = [];

let timer = null;

let metroRunning = false;

let metroTimer = null;

let beat = 0;

let nextBeatTime = 0;

let audioContext = null;


/* =========================================================
   DOM
========================================================= */

const $ = id =>
  document.getElementById(id);


/* =========================================================
   랜덤
========================================================= */

function rand(array){

  return array[
    Math.floor(
      Math.random() * array.length
    )
  ];

}


/* =========================================================
   BPM
========================================================= */

function getBPM(){

  let bpm =
    parseInt(
      $("tempo").value,
      10
    );

  if(isNaN(bpm)){
    bpm = 100;
  }

  bpm =
    Math.max(
      40,
      Math.min(
        220,
        bpm
      )
    );

  $("tempo").value = bpm;

  return bpm;

}


/* =========================================================
   Web Audio 생성
========================================================= */

/*
   외부 mp3 파일을 사용하지 않습니다.

   따라서 GitHub Pages에서
   mp3 경로 문제,
   iPhone에서 파일 재생 문제,
   상대경로 문제 등을 피할 수 있습니다.
*/

function initAudio(){

  if(!audioContext){

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioContext){
      alert(
        "이 브라우저에서는 Web Audio를 사용할 수 없습니다."
      );
      return false;
    }

    audioContext =
      new AudioContext();

  }

  if(audioContext.state === "suspended"){

    audioContext.resume();

  }

  return true;

}


/* =========================================================
   메트로놈 클릭음
========================================================= */

function playClick(accent=false){

  if(!audioContext){
    return;
  }

  const now =
    audioContext.currentTime;

  const oscillator =
    audioContext.createOscillator();

  const gain =
    audioContext.createGain();

  oscillator.type = "sine";

  /*
    첫 박자는 조금 높은 음,
    나머지는 낮은 음
  */

  oscillator.frequency.value =
    accent
      ? 1500
      : 1000;

  /*
    아주 짧은 클릭음
  */

  gain.gain.setValueAtTime(
    0.0001,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    accent ? 0.35 : 0.25,
    now + 0.002
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    now + 0.055
  );

  oscillator.connect(gain);

  gain.connect(
    audioContext.destination
  );

  oscillator.start(now);

  oscillator.stop(
    now + 0.06
  );

}


/* =========================================================
   문제 생성
========================================================= */

function generate(){

  const mode =
    $("keyMode").value;

  const key =
    mode === "random"
      ? rand(keys)
      : $("fixedKey").value;

  $("key").textContent =
    key;

  const pool =
    pools[
      $("level").value
    ];

  current =
    Array.from(
      {length:4},
      () => rand(pool)
    );

  render();

  $("status").textContent =
    "새로운 문제가 생성되었습니다. 설정한 시간 동안 진행을 기억하세요.";

}


/* =========================================================
   문제 화면
========================================================= */

function render(){

  $("grid").innerHTML = "";

  current.forEach(
    (chord,index)=>{

      const box =
        document.createElement("div");

      box.className =
        "bar";

      box.innerHTML =

        '<div class="num">' +
        (index + 1) +
        '마디</div>' +

        '<div class="chord">' +
        chord +
        '</div>';

      $("grid")
        .appendChild(box);

    }
  );

  $("grid")
    .classList
    .remove("hidden");

  $("count").textContent = "";

}


/* =========================================================
   도수 숨기기
========================================================= */

function hide(){

  $("grid")
    .classList
    .add("hidden");

}


/* =========================================================
   카운트다운
========================================================= */

function start(){

  /*
    이전 카운트 제거
  */

  clearInterval(timer);

  /*
    메트로놈이 이미 실행 중이면 정지
  */

  if(metroRunning){

    stopMetro();

  }

  /*
    사용자 터치 직후 AudioContext 활성화
  */

  initAudio();

  /*
    새로운 문제 생성
  */

  generate();

  /*
    사용자가 선택한 암기 시간
  */

  let remaining =
    parseInt(
      $("seconds").value,
      10
    );

  /*
    처음부터 선택한 시간이 표시됨
  */

  $("count").textContent =
    remaining;

  $("status").textContent =
    "진행을 암기하세요.";

  /*
    1초마다 감소
  */

  timer =
    setInterval(()=>{

      remaining--;

      if(remaining > 0){

        $("count").textContent =
          remaining;

        return;

      }

      /*
        종료
      */

      clearInterval(timer);

      timer = null;

      $("count").textContent = "";

      hide();

      /*
        암기 종료 직후
        메트로놈 시작
      */

      startMetro();

      $("status").textContent =
        "도수가 숨겨졌습니다. 메트로놈에 맞춰 연주하세요.";

    },1000);

}


/* =========================================================
   도수 다시 보기
========================================================= */

function show(){

  clearInterval(timer);

  timer = null;

  $("count").textContent = "";

  render();

  $("status").textContent =
    "도수를 다시 확인할 수 있습니다.";

}


/* =========================================================
   키 선택
========================================================= */

$("keyMode").onchange = ()=>{

  $("fixedKey").style.display =
    $("keyMode").value === "fixed"
      ? "block"
      : "none";

};


/* =========================================================
   새 문제
========================================================= */

$("start").onclick = ()=>{

  start();

};


/* =========================================================
   다시 보기
========================================================= */

$("show").onclick = ()=>{

  show();

};


/* =========================================================
   BPM -
========================================================= */

$("tempoMinus").onclick = ()=>{

  const bpm =
    getBPM();

  $("tempo").value =
    Math.max(
      40,
      bpm - 5
    );

  if(metroRunning){

    restartMetro();

  }

};


/* =========================================================
   BPM +
========================================================= */

$("tempoPlus").onclick = ()=>{

  const bpm =
    getBPM();

  $("tempo").value =
    Math.min(
      220,
      bpm + 5
    );

  if(metroRunning){

    restartMetro();

  }

};


/* =========================================================
   박자 표시
========================================================= */

function visualBeat(){

  const spans =
    $("beats")
      .querySelectorAll("span");

  spans.forEach(
    (span,index)=>{

      span.classList.toggle(
        "active",
        index === beat
      );

    }
  );

}


/* =========================================================
   정확한 박자 예약
========================================================= */

function scheduleNextBeat(){

  if(!metroRunning){
    return;
  }

  const bpm =
    getBPM();

  const interval =
    60000 / bpm;

  const now =
    performance.now();

  /*
    브라우저가 잠시 지연되더라도
    다음 박자 기준점을 다시 잡음
  */

  if(
    nextBeatTime <
    now - interval
  ){

    nextBeatTime =
      now;

  }

  const delay =
    Math.max(
      0,
      nextBeatTime - now
    );

  metroTimer =
    setTimeout(()=>{

      if(!metroRunning){
        return;
      }

      /*
        현재 박자
      */

      const currentBeat =
        beat;

      /*
        소리 재생
      */

      playClick(
        currentBeat === 0
      );

      /*
        화면 표시
      */

      visualBeat();

      /*
        다음 박자
      */

      beat =
        (beat + 1) % 4;

      nextBeatTime +=
        interval;

      scheduleNextBeat();

    },delay);

}


/* =========================================================
   메트로놈 시작
========================================================= */

function startMetro(){

  if(!initAudio()){
    return;
  }

  clearTimeout(metroTimer);

  metroTimer = null;

  metroRunning = true;

  beat = 0;

  $("metro").textContent =
    "메트로놈 정지";

  /*
    첫 박자를 즉시 재생
  */

  nextBeatTime =
    performance.now();

  playClick(true);

  visualBeat();

  beat = 1;

  /*
    두 번째 박자 예약
  */

  const bpm =
    getBPM();

  nextBeatTime +=
    60000 / bpm;

  scheduleNextBeat();

}


/* =========================================================
   메트로놈 재시작
========================================================= */

function restartMetro(){

  stopMetro();

  /*
    약간의 지연 없이
    바로 다시 시작
  */

  startMetro();

}


/* =========================================================
   메트로놈 정지
========================================================= */

function stopMetro(){

  clearTimeout(metroTimer);

  metroTimer = null;

  metroRunning = false;

  beat = 0;

  const spans =
    $("beats")
      .querySelectorAll("span");

  spans.forEach(
    span=>{
      span.classList.remove("active");
    }
  );

  $("metro").textContent =
    "메트로놈 시작";

}


/* =========================================================
   메트로놈 버튼
========================================================= */

$("metro").onclick = ()=>{

  /*
    이 함수는 반드시
    사용자의 실제 터치 이벤트에서 실행됨.

    따라서 iPhone Safari에서도
    AudioContext를 정상적으로 활성화할 수 있음.
  */

  if(metroRunning){

    stopMetro();

  }else{

    initAudio();

    startMetro();

  }

};


/* =========================================================
   초기 화면
========================================================= */

generate();

</script>

</body>
</html>
