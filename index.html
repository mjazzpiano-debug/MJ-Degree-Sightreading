<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>MJ 도수 초견 트레이너</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f7f7f7;
  color:#111;
  font-family:Arial,"Noto Sans KR",sans-serif
}

.wrap{
  max-width:900px;
  margin:0 auto;
  padding:28px 18px 40px
}

h1{
  font-size:28px;
  margin:0 0 6px;
  font-weight:800
}

.sub{
  color:#666;
  margin-bottom:24px
}

.panel{
  background:#fff;
  border:1px solid #ddd;
  border-radius:18px;
  padding:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.04)
}

.controls{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:18px
}

label{
  font-size:13px;
  color:#666;
  display:block;
  margin-bottom:6px
}

select,
input,
button{
  font:inherit
}

select,
input[type=number]{
  width:100%;
  height:44px;
  border:1px solid #ccc;
  border-radius:10px;
  padding:0 12px;
  background:#fff
}

button{
  border:0;
  border-radius:11px;
  height:46px;
  padding:0 18px;
  font-weight:700;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation
}

.primary{
  background:#111;
  color:#fff
}

.secondary{
  background:#eee;
  color:#111
}

.keyline{
  text-align:center;
  margin:10px 0 16px
}

.key{
  font-size:22px;
  font-weight:800
}

.status{
  text-align:center;
  color:#666;
  min-height:24px;
  font-size:14px
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin:18px 0
}

.bar{
  height:150px;
  background:#fafafa;
  border:1px solid #d8d8d8;
  border-radius:12px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden
}

.bar:before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:4px;
  background:#111
}

.num{
  position:absolute;
  top:10px;
  left:14px;
  font-size:12px;
  color:#999
}

.chord{
  font-size:27px;
  font-weight:800;
  letter-spacing:-.5px
}

.hidden .chord{
  visibility:hidden
}

.hidden .bar{
  background:#eee
}

.hidden .bar:before{
  background:#bbb
}

.hidden .num{
  visibility:hidden
}

.actions{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap
}

.big{
  min-width:180px
}

.metronome{
  margin-top:18px;
  padding-top:18px;
  border-top:1px solid #eee;
  text-align:center
}

.beat{
  font-size:30px;
  font-weight:800;
  letter-spacing:8px;
  margin:8px 0 12px;
  min-height:38px
}

.beat span.active{
  opacity:1
}

.beat span{
  opacity:.18
}

.note{
  font-size:13px;
  color:#777;
  line-height:1.6;
  margin-top:14px
}

.count{
  font-size:48px;
  font-weight:900;
  text-align:center;
  height:58px
}

@media(max-width:650px){

 .wrap{
   padding:20px 12px 30px
 }

 h1{
   font-size:23px
 }

 .controls{
   grid-template-columns:1fr 1fr
 }

 .grid{
   grid-template-columns:repeat(2,1fr)
 }

 .bar{
   height:125px
 }

 .chord{
   font-size:22px
 }

 .actions button{
   width:100%
 }

 .big{
   min-width:0
 }
}
</style>
</head>

<body>

<div class="wrap">

  <h1>MJ 도수 초견 트레이너</h1>

  <div class="sub">
    랜덤 4마디 · 5~60초 암기 · 도수 숨김 · 메트로놈 연주
  </div>

  <div class="panel">

    <div class="controls">

      <div>
        <label>난이도</label>

        <select id="level">
          <option value="basic">중급</option>
          <option value="advanced" selected>중상급</option>
          <option value="hard">상급</option>
        </select>
      </div>

      <div>
        <label>템포 (BPM)</label>

        <input
          id="tempo"
          type="number"
          min="40"
          max="220"
          value="100"
        >
      </div>

      <div>
        <label>암기 시간</label>

        <select id="seconds">
          <option value="5">5초</option>
          <option value="10" selected>10초</option>
          <option value="15">15초</option>
          <option value="20">20초</option>
          <option value="25">25초</option>
          <option value="30">30초</option>
          <option value="35">35초</option>
          <option value="40">40초</option>
          <option value="45">45초</option>
          <option value="50">50초</option>
          <option value="55">55초</option>
          <option value="60">60초</option>
        </select>
      </div>

      <div>

        <label>키</label>

        <select id="keyMode">
          <option value="random" selected>랜덤 12키</option>
          <option value="fixed">직접 선택</option>
        </select>

        <select
          id="fixedKey"
          style="display:none;margin-top:6px"
        >
          <option>Bb</option>
          <option>C</option>
          <option>Db</option>
          <option>D</option>
          <option>Eb</option>
          <option>E</option>
          <option>F</option>
          <option>Gb</option>
          <option>G</option>
          <option>Ab</option>
          <option>A</option>
          <option>B</option>
        </select>

      </div>

    </div>


    <div class="keyline">
      KEY <span class="key" id="key">Bb</span>
    </div>

    <div class="status" id="status">
      새로운 진행을 생성하세요.
    </div>

    <div class="count" id="count"></div>

    <div class="grid" id="grid"></div>


    <div class="actions">

      <button
        class="primary big"
        id="start"
      >
        새 문제 + 10초 카운트
      </button>

      <button
        class="secondary big"
        id="show"
      >
        도수 다시 보기
      </button>

      <button
        class="secondary"
        id="tempoMinus"
      >
        BPM −5
      </button>

      <button
        class="secondary"
        id="tempoPlus"
      >
        BPM +5
      </button>

    </div>


    <div class="metronome">

      <div style="font-weight:700">
        METRONOME
      </div>

      <div
        class="beat"
        id="beats"
      >
        <span>1</span>
        <span>2</span>
        <span>3</span>
        <span>4</span>
      </div>

      <button
        class="primary"
        id="metro"
      >
        메트로놈 시작
      </button>

    </div>


    <div class="note">

      • 문제를 생성하면 먼저 설정한 암기 시간 동안 4마디 도수를 확인합니다.<br>

      • 암기 시간이 끝나면 도수가 자동으로 사라지고 메트로놈에 맞춰 연주합니다.<br>

      • 모바일에서도 사용할 수 있도록 반응형으로 제작했습니다.

    </div>

  </div>
</div>


<script>

const keys=[
  "C","Db","D","Eb","E","F",
  "Gb","G","Ab","A","Bb","B"
];


const pools={

 basic:[
   "I",
   "IIM7",
   "IIm7",
   "III7",
   "IIIm7",
   "IVM7",
   "V7",
   "VIm7",
   "VIIø7",
   "bVIIM7"
 ],

 advanced:[
   "I",
   "IM7",
   "IIm7",
   "II7",
   "IIIM7",
   "III7",
   "IVM7",
   "IVm7",
   "V7",
   "VIm7",
   "VI7",
   "VIIø7",
   "bII7",
   "bVIIM7",
   "bVI7",
   "bVII7",
   "bIII7"
 ],

 hard:[
   "I",
   "IM7",
   "IIm7",
   "II7",
   "IIø7",
   "IIIM7",
   "III7",
   "IVM7",
   "IVm7",
   "IV7",
   "V7",
   "V7(b9)",
   "V7(#9)",
   "VIm7",
   "VI7",
   "VIIø7",
   "bII7",
   "bIIIM7",
   "bVI7",
   "bVIIM7",
   "bVII7",
   "bVIIIM7"
 ]

};


let current=[];
let timer=null;

let metroTimer=null;
let metroRunning=false;
let beat=0;


/* --------------------------------
   iPhone / Android용 HTML5 Audio
-------------------------------- */

let audioUnlocked=false;

let normalClick=null;
let accentClick=null;


/*
  작은 WAV 파일을 JavaScript로 직접 생성합니다.
  외부 음원 파일이나 서버 파일이 필요하지 않습니다.
*/

function createClickWav(frequency,duration,volume){

  const sampleRate=44100;
  const samples=Math.floor(sampleRate*duration);

  const buffer=new ArrayBuffer(44+samples*2);
  const view=new DataView(buffer);

  function writeString(offset,string){
    for(let i=0;i<string.length;i++){
      view.setUint8(offset+i,string.charCodeAt(i));
    }
  }

  writeString(0,"RIFF");
  view.setUint32(4,36+samples*2,true);
  writeString(8,"WAVE");
  writeString(12,"fmt ");

  view.setUint32(16,16,true);
  view.setUint16(20,1,true);
  view.setUint16(22,1,true);
  view.setUint32(24,sampleRate,true);
  view.setUint32(28,sampleRate*2,true);
  view.setUint16(32,2,true);
  view.setUint16(34,16,true);

  writeString(36,"data");
  view.setUint32(40,samples*2,true);

  for(let i=0;i<samples;i++){

    const t=i/sampleRate;

    /*
      아주 짧은 클릭음.
      처음에는 크게, 뒤로 갈수록 빠르게 감쇠합니다.
    */

    const envelope=Math.exp(-t*75);

    const sample=
      Math.sin(2*Math.PI*frequency*t)
      *envelope
      *volume;

    view.setInt16(
      44+i*2,
      Math.max(-1,Math.min(1,sample))*32767,
      true
    );
  }

  let binary="";

  const bytes=new Uint8Array(buffer);

  for(let i=0;i<bytes.length;i++){
    binary+=String.fromCharCode(bytes[i]);
  }

  return "data:audio/wav;base64,"+
    btoa(binary);
}


/*
  메트로놈 클릭음 준비
*/

function prepareAudio(){

  if(normalClick && accentClick){
    return;
  }

  normalClick=new Audio(
    createClickWav(800,0.07,0.32)
  );

  accentClick=new Audio(
    createClickWav(1100,0.07,0.38)
  );

  normalClick.preload="auto";
  accentClick.preload="auto";

  /*
    iPhone Safari에서 이후 재생이 가능하도록
    오디오 요소를 미리 준비합니다.
  */

  normalClick.load();
  accentClick.load();
}


/*
  사용자가 버튼을 누르는 순간 호출됩니다.

  iPhone에서는 사용자 터치와 연결된 순간에
  Audio를 한 번 재생해 두는 것이 중요합니다.
*/

function unlockAudio(){

  prepareAudio();

  if(audioUnlocked){
    return;
  }

  /*
    아주 짧게 실제 오디오를 재생했다가 정지합니다.
    이 호출은 반드시 사용자의 터치 이벤트 안에서
    실행되도록 합니다.
  */

  try{

    normalClick.currentTime=0;

    const p=normalClick.play();

    if(p && typeof p.then==="function"){

      p.then(()=>{

        normalClick.pause();
        normalClick.currentTime=0;
        audioUnlocked=true;

      }).catch(()=>{

        audioUnlocked=false;

      });

    }else{

      audioUnlocked=true;

    }

  }catch(e){

    audioUnlocked=false;

  }
}


/*
  실제 메트로놈 클릭
*/

function clickSound(accent=false){

  prepareAudio();

  const audio=accent
    ? accentClick
    : normalClick;

  if(!audio){
    return;
  }

  try{

    audio.pause();
    audio.currentTime=0;

    const p=audio.play();

    /*
      일부 iOS 버전에서는 play()가 Promise를 반환합니다.
      에러가 나더라도 프로그램 자체는 계속 작동하게 합니다.
    */

    if(p && typeof p.catch==="function"){
      p.catch(()=>{});
    }

  }catch(e){}

}


/* --------------------------------
   문제 생성
-------------------------------- */

const $=id=>document.getElementById(id);


function rand(a){
  return a[
    Math.floor(Math.random()*a.length)
  ];
}


function generate(){

  const mode=$("keyMode").value;

  const key=
    mode==="random"
      ? rand(keys)
      : $("fixedKey").value;

  $("key").textContent=key;

  const pool=pools[$("level").value];

  current=Array.from(
    {length:4},
    ()=>rand(pool)
  );

  render();

  $("status").textContent=
    "새로운 문제가 생성되었습니다. 설정한 시간 동안 진행을 기억하세요.";

}


function render(){

  $("grid").innerHTML="";

  current.forEach((x,i)=>{

    const d=document.createElement("div");

    d.className="bar";

    d.innerHTML=
      '<div class="num">'+
      (i+1)+
      '마디</div>'+
      '<div class="chord">'+
      x+
      '</div>';

    $("grid").appendChild(d);

  });

  $("grid").classList.remove("hidden");

  $("count").textContent="";
}


function hide(){

  $("grid").classList.add("hidden");

}


/* --------------------------------
   문제 시작
-------------------------------- */

function start(){

  /*
    ★ 가장 중요
    사용자가 "새 문제" 버튼을 누른 바로 그 순간
    오디오를 준비합니다.

    따라서 카운트다운이 끝난 뒤에도
    메트로놈을 사용할 수 있습니다.
  */

  unlockAudio();

  clearInterval(timer);

  generate();

  let n=parseInt(
    $("seconds").value,
    10
  );

  $("count").textContent=n;

  $("status").textContent=
    "진행을 암기하세요.";

  timer=setInterval(()=>{

    n--;

    if(n>0){

      $("count").textContent=n;

    }else{

      clearInterval(timer);

      $("count").textContent="";

      hide();

      /*
        암기 시간이 끝나는 순간
        메트로놈 자동 시작
      */

      if(metroRunning){
        stopMetro();
      }

      startMetro();

      $("status").textContent=
        "도수가 숨겨졌습니다. 메트로놈이 자동으로 시작됩니다.";

    }

  },1000);

}


/* --------------------------------
   도수 다시 보기
-------------------------------- */

function show(){

  clearInterval(timer);

  $("count").textContent="";

  render();

  $("status").textContent=
    "도수를 다시 확인할 수 있습니다.";

}


/* --------------------------------
   설정
-------------------------------- */

$("keyMode").onchange=()=>{

  $("fixedKey").style.display=
    $("keyMode").value==="fixed"
      ?"block"
      :"none";

};


$("start").onclick=start;


$("show").onclick=show;


$("tempoMinus").onclick=()=>{

  $("tempo").value=
    Math.max(
      40,
      parseInt($("tempo").value||100)-5
    );

  if(metroRunning){

    stopMetro();
    startMetro();

  }

};


$("tempoPlus").onclick=()=>{

  $("tempo").value=
    Math.min(
      220,
      parseInt($("tempo").value||100)+5
    );

  if(metroRunning){

    stopMetro();
    startMetro();

  }

};


/* --------------------------------
   비트 표시
-------------------------------- */

function visualBeat(){

  const spans=
    $("beats").querySelectorAll("span");

  spans.forEach((s,i)=>{

    s.classList.toggle(
      "active",
      i===beat
    );

  });

  beat=(beat+1)%4;

}


/* --------------------------------
   메트로놈 시작
-------------------------------- */

function startMetro(){

  /*
    혹시 직접 메트로놈 버튼을 눌렀다면
    이 순간에도 오디오를 준비합니다.
  */

  prepareAudio();

  const bpm=Math.max(
    40,
    Math.min(
      220,
      parseInt($("tempo").value)||100
    )
  );

  const interval=60000/bpm;

  metroRunning=true;

  beat=0;

  $("metro").textContent=
    "메트로놈 정지";


  /*
    첫 박자 즉시 재생
  */

  clickSound(true);

  visualBeat();


  /*
    이후 BPM에 맞춰 재생
  */

  metroTimer=setInterval(()=>{

    clickSound(beat===0);

    visualBeat();

  },interval);

}


/* --------------------------------
   메트로놈 정지
-------------------------------- */

function stopMetro(){

  clearInterval(metroTimer);

  metroTimer=null;

  metroRunning=false;

  $("metro").textContent=
    "메트로놈 시작";

  $("beats")
    .querySelectorAll("span")
    .forEach(s=>
      s.classList.remove("active")
    );

}


/* --------------------------------
   메트로놈 버튼
-------------------------------- */

$("metro").onclick=()=>{

  /*
    직접 버튼을 눌렀을 때
    반드시 사용자 터치와 오디오 재생이
    연결되도록 합니다.
  */

  unlockAudio();

  if(metroRunning){

    stopMetro();

  }else{

    startMetro();

  }

};


/* --------------------------------
   초기 화면
-------------------------------- */

prepareAudio();

generate();

</script>

</body>
</html>
