<style>
  .sound-guide-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 99999;
  }

  .sound-guide-box {
    width: 100%;
    max-width: 360px;
    background: #fff;
    border-radius: 18px;
    padding: 25px 22px 22px;
    box-sizing: border-box;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0,0,0,0.25);
  }

  .sound-guide-title {
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 14px;
    color: #111;
  }

  .sound-guide-text {
    font-size: 15px;
    line-height: 1.7;
    color: #444;
    margin-bottom: 20px;
  }

  .sound-guide-highlight {
    font-weight: 700;
    color: #111;
  }

  .sound-guide-button {
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 13px 10px;
    background: #111;
    color: white;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .sound-guide-button:active {
    transform: scale(0.98);
  }

  /* 팝업이 닫힌 상태 */
  .sound-guide-overlay.hidden {
    display: none !important;
  }
</style>

<!-- 소리 안내 팝업 -->
<div class="sound-guide-overlay" id="soundGuide">
  <div class="sound-guide-box">

    <div class="sound-guide-title">
      🔊 소리 안내
    </div>

    <div class="sound-guide-text">

      아이폰에서 소리가 나지 않을 경우<br><br>

      <span class="sound-guide-highlight">
        ① 무음 모드를 해제해주세요.
      </span><br>

      ② 휴대폰 볼륨을 확인해주세요.<br>

      ③ 카카오톡에서 실행되지 않는 경우,<br>

      <span class="sound-guide-highlight">
        주소를 복사하여 Safari에서 직접 접속해주세요.
      </span><br>

      ④ 아래의 <b>소리 활성화</b> 버튼을 눌러주세요.

    </div>

    <button
      type="button"
      class="sound-guide-button"
      id="soundGuideClose">
      확인했습니다
    </button>

  </div>
</div>

<script>
(function () {

  function closeSoundGuide() {

    const guide = document.getElementById("soundGuide");

    if (!guide) return;

    // 팝업을 완전히 제거
    guide.classList.add("hidden");

    // 혹시 남아 있는 터치 방해도 제거
    guide.style.pointerEvents = "none";

    // 페이지 스크롤 잠금이 걸려 있다면 해제
    document.body.style.overflow = "";
    document.documentElement.style.overflow = "";

  }

  // 버튼 클릭
  const closeButton = document.getElementById("soundGuideClose");

  if (closeButton) {
    closeButton.addEventListener("click", closeSoundGuide);
    closeButton.addEventListener("touchend", function (e) {
      e.preventDefault();
      closeSoundGuide();
    }, { passive: false });
  }

})();
</script>
