<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>MJ 도수 초견 트레이너</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f7f7;color:#111;font-family:Arial,"Noto Sans KR",sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:28px 18px 40px}
h1{font-size:28px;margin:0 0 6px;font-weight:800}
.sub{color:#666;margin-bottom:24px}
.panel{background:#fff;border:1px solid #ddd;border-radius:18px;padding:20px;box-shadow:0 5px 20px rgba(0,0,0,.04)}
.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
label{font-size:13px;color:#666;display:block;margin-bottom:6px}
select,input,button{font:inherit}
select,input[type=number]{width:100%;height:44px;border:1px solid #ccc;border-radius:10px;padding:0 12px;background:#fff}
button{border:0;border-radius:11px;height:46px;padding:0 18px;font-weight:700;cursor:pointer}
.primary{background:#111;color:#fff}
.secondary{background:#eee;color:#111}
.keyline{text-align:center;margin:10px 0 16px}
.key{font-size:22px;font-weight:800}
.status{text-align:center;color:#666;min-height:24px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}
.bar{height:150px;background:#fafafa;border:1px solid #d8d8d8;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
.bar:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#111}
.num{position:absolute;top:10px;left:14px;font-size:12px;color:#999}
.chord{font-size:27px;font-weight:800;letter-spacing:-.5px}
.hidden .chord{visibility:hidden}
.hidden .bar{background:#eee}
.hidden .bar:before{background:#bbb}
.hidden .num{visibility:hidden}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.big{min-width:180px}
.metronome{margin-top:18px;padding-top:18px;border-top:1px solid #eee;text-align:center}
.beat{font-size:30px;font-weight:800;letter-spacing:8px;margin:8px 0 12px;min-height:38px}
.beat span.active{opacity:1}
.beat span{opacity:.18}
.note{font-size:13px;color:#777;line-height:1.6;margin-top:14px}
.count{font-size:48px;font-weight:900;text-align:center;height:58px}

@media(max-width:650px){
 .wrap{padding:20px 12px 30px}
 h1{font-size:23px}
 .controls{grid-template-columns:1fr 1fr}
 .grid{grid-template-columns:repeat(2,1fr)}
 .bar{height:125px}
 .chord{font-size:22px}
 .actions button{width:100%}
 .big{min-width:0}
}
</style>
</head>

<body>

<div class="wrap">
<h1>MJ 도수 초견 트레이너</h1>
<div class="sub">랜덤 4마디 · 암기 · 도수 숨김 · 메트로놈 연주</div>

<div class="panel">

<div class="controls">

<div>
<label>난이도</label>
<select id="level">
<option value="basic">중급</option>
<option value="advanced" selected>중상급</option>
<option value="hard">상급</option>
</select>
</div>

<div>
<label>템포 (BPM)</label>
<input id="tempo" type="number" min="40" max="220" value="100">
</div>

<div>
<label>암기 시간</label>
<select id="seconds">
<option value="5">5초</option>
<option value="10" selected>10초</option>
<option value="15">15초</option>
<option value="20">20초</option>
<option value="25">25초</option>
<option value="30">30초</option>
<option value="35">35초</option>
<option value="40">40초</option>
<option value="45">45초</option>
<option value="50">50초</option>
<option value="55">55초</option>
<option value="60">60초</option>
</select>
</div>

<div>
<label>키</label>

<select id="keyMode">
<option value="random" selected>랜덤 12키</option>
<option value="fixed">직접 선택</option>
</select>

<select id="fixedKey" style="display:none;margin-top:6px">
<option>Bb</option>
<option>C</option>
<option>Db</option>
<option>D</option>
<option>Eb</option>
<option>E</option>
<option>F</option>
<option>Gb</option>
<option>G</option>
<option>Ab</option>
<option>A</option>
<option>B</option>
</select>

</div>
</div>

<div class="keyline">
KEY <span class="key" id="key">Bb</span>
</div>

<div class="status" id="status">
새로운 진행을 생성하세요.
</div>

<div class="count" id="count"></div>

<div class="grid" id="grid"></div>

<div class="actions">

<button class="primary big" id="start">
새 문제 + 카운트
</button>

<button class="secondary big" id="show">
도수 다시 보기
</button>

<button class="secondary" id="tempoMinus">
BPM −5
</button>

<button class="secondary" id="tempoPlus">
BPM +5
</button>

</div>

<div class="metronome">

<div style="font-weight:700">
METRONOME
</div>

<div class="beat" id="beats">
<span>1</span>
<span>2</span>
<span>3</span>
<span>4</span>
</div>

<button class="primary" id="metro">
메트로놈 시작
</button>

</div>

<div class="note">
• 문제를 생성하면 먼저 4마디 도수를 확인합니다.<br>
• 카운트가 끝나면 도수가 자동으로 사라집니다.<br>
• 메트로놈에 맞춰 연주합니다.<br>
• iPhone / Android에서 사용할 수 있습니다.
</div>

</div>
</div>


<script>

const keys=[
"C","Db","D","Eb","E","F","Gb","G","Ab","A","Bb","B"
];

const pools={

basic:[
"I","IIM7","IIm7","III7","IIIm7",
"IVM7","V7","VIm7","VIIø7","bVIIM7"
],

advanced:[
"I","IM7","IIm7","II7","IIIM7","III7",
"IVM7","IVm7","V7","VIm7","VI7",
"VIIø7","bII7","bVIIM7","bVI7","bVII7","bIII7"
],

hard:[
"I","IM7","IIm7","II7","IIø7","IIIM7",
"III7","IVM7","IVm7","IV7","V7",
"V7(b9)","V7(#9)","VIm7","VI7","VIIø7",
"bII7","bIIIM7","bVI7","bVIIM7",
"bVII7","bVIIIM7"
]

};


let current=[];
let timer=null;

let audioCtx=null;
let metroTimer=null;
let metroRunning=false;
let beat=0;


/* ---------------------------
   기본 함수
---------------------------- */

const $=id=>document.getElementById(id);

function rand(a){
return a[Math.floor(Math.random()*a.length)];
}


/* ---------------------------
   문제 생성
---------------------------- */

function generate(){

const mode=$("keyMode").value;

const key=
mode==="random"
?rand(keys)
:$("fixedKey").value;

$("key").textContent=key;

const pool=pools[$("level").value];

current=Array.from(
{length:4},
()=>rand(당구)
);

render();

$("status").textContent=
"새로운 문제가 생성되었습니다.";

}


/* ---------------------------
   화면 출력
---------------------------- */

function render(){

$("grid").innerHTML="";

current.forEach((x,i)=>{

const d=document.createElement("div");

d.className="bar";

d.innerHTML=
'<div class="num">'+
(i+1)+
'마디</div>'+
'<div class="chord">'+
x+
'</div>';

$("grid").appendChild(d);

});

$("grid").classList.remove("hidden");

$("count").textContent="";

}


function hide(){

$("grid").classList.add("hidden");

}


/* ---------------------------
   문제 시작
---------------------------- */

function start(){

clearInterval(timer);

generate();

let n=
parseInt($("seconds").value,10);

$("count").textContent=n;

$("status").textContent=
"진행을 암기하세요.";

timer=setInterval(()=>{

n--;

if(n>0){

$("count").textContent=n;

}else{

clearInterval(timer);

$("count").textContent="";

hide();


/*
 iPhone Safari에서는
 여기서 AudioContext.resume()을
 다시 호출하지 않는다.

 시작 버튼을 눌렀을 때 이미
 오디오를 활성화해 둔다.
*/

if(metroRunning)
stopMetro();

if(startMetro()){

$("status").textContent=
"도수가 숨겨졌습니다. 메트로놈이 시작됩니다.";

}else{

$("status").textContent=
"도수가 숨겨졌습니다. 아래 메트로놈 버튼을 눌러주세요.";

}

}

},1000);

}


/* ---------------------------
   도수 다시 보기
---------------------------- */

function show(){

clearInterval(timer);

$("count").textContent="";

render();

$("status").textContent=
"도수를 다시 확인할 수 있습니다.";

}


/* ---------------------------
   iPhone AudioContext
---------------------------- */

async function ensureAudio(){

const AC=
window.AudioContext ||
window.webkitAudioContext;

if(!AC){

throw new Error(
"Web Audio API를 지원하지 않습니다."
);

}


/*
 최초 사용자 터치에서만
 AudioContext 생성
*/

if(!audioCtx){

audioCtx=new AC();


/*
 iPhone Safari 오디오 잠금 해제용
 아주 짧은 무음 재생
*/

const buffer=
audioCtx.createBuffer(
1,
1,
audioCtx.sampleRate
);

const source=
audioCtx.createBufferSource();

const gain=
audioCtx.createGain();

gain.gain.setValueAtTime(
0.00001,
audioCtx.currentTime
);

source.buffer=buffer;

source.connect(gain);

gain.connect(
audioCtx.destination
);

source.start(0);


/*
 추가 unlock oscillator
*/

const osc=
audioCtx.createOscillator();

const oscGain=
audioCtx.createGain();

oscGain.gain.setValueAtTime(
0.00001,
audioCtx.currentTime
);

osc.connect(oscGain);

oscGain.connect(
audioCtx.destination
);

osc.start();

osc.stop(
audioCtx.currentTime+0.03
);

}


/*
 Safari가 suspended 상태라면
 사용자 터치 안에서 resume
*/

if(audioCtx.state==="suspended"){

await audioCtx.resume();

}


/*
 혹시 아직 running이 아니라면
 한 번 더 확인
*/

if(audioCtx.state!=="running"){

throw new Error(
"오디오가 활성화되지 않았습니다."
);

}

}


/* ---------------------------
   메트로놈 소리
---------------------------- */

function clickSound(accent=false){

if(
!audioCtx ||
audioCtx.state!=="running"
)return;

const now=
audioCtx.currentTime;

const oscillator=
audioCtx.createOscillator();

const gain=
audioCtx.createGain();


/*
 모바일에서도 잘 들리도록
 첫 박자 음을 조금 높게
*/

oscillator.type="sine";

oscillator.frequency.setValueAtTime(
accent ? 1200 : 850,
now
);


/*
 소리 시작
*/

gain.gain.setValueAtTime(
0.0001,
now
);

gain.gain.exponentialRampToValueAtTime(
accent ? 0.24 : 0.18,
now+0.003
);

gain.gain.exponentialRampToValueAtTime(
0.0001,
now+0.065
);

oscillator.connect(gain);

gain.connect(
audioCtx.destination
);

oscillator.start(now);

oscillator.stop(
now+0.07
);

}


/* ---------------------------
   박자 표시
---------------------------- */

function visualBeat(){

const spans=
$("beats").querySelectorAll("span");

spans.forEach(
(s,i)=>
s.classList.toggle(
"active",
i===beat
)
);

beat=
(beat+1)%4;

}


/* ---------------------------
   메트로놈 시작
---------------------------- */

function startMetro(){

/*
 AudioContext가
 이미 활성화되어 있어야 한다.
*/

if(
!audioCtx ||
audioCtx.state!=="running"
){

$("status").textContent=
"메트로놈 버튼을 한 번 눌러 오디오를 활성화하세요.";

return false;

}


if(metroTimer)
clearInterval(metroTimer);


const bpm=
Math.max(
40,
Math.min(
220,
parseInt(
$("tempo").value
)||100
)
);


const interval=
60000/bpm;


metroRunning=true;

beat=0;

$("metro").textContent=
"메트로놈 정지";


/*
 첫 박자 즉시 재생
*/

clickSound(true);

visualBeat();


/*
 이후에는 단순 타이머로
 소리만 발생시킨다.

 중요:
 setInterval 안에서
 audioCtx.resume()을 하지 않는다.
*/

metroTimer=setInterval(()=>{

if(
audioCtx &&
audioCtx.state==="running"
){

clickSound(
beat===0
);

visualBeat();

}

},interval);


return true;

}


/* ---------------------------
   메트로놈 정지
---------------------------- */

function stopMetro(){

clearInterval(metroTimer);

metroTimer=null;

metroRunning=false;

$("metro").textContent=
"메트로놈 시작";

$("beats")
.querySelectorAll("span")
.forEach(
s=>s.classList.remove("active")
);

}


/* ---------------------------
   키 선택
---------------------------- */

$("keyMode").onchange=()=>{

$("fixedKey").style.display=
$("keyMode").value==="fixed"
?"block"
:"none";

};


/* ---------------------------
   새 문제 버튼
---------------------------- */

$("start").onclick=async()=>{

try{

/*
 반드시 사용자가
 직접 누른 순간 AudioContext 활성화
*/

await ensureAudio();

start();

}catch(e){

$("status").textContent=
"오디오 초기화 실패. 메트로놈 버튼을 한 번 눌러주세요.";

}

};


/* ---------------------------
   다시 보기
---------------------------- */

$("show").onclick=show;


/* ---------------------------
   BPM -
---------------------------- */

$("tempoMinus").onclick=()=>{

$("tempo").value=
Math.max(
40,
parseInt(
$("tempo").value||100
)-5
);

if(metroRunning){

stopMetro();

startMetro();

}

};


/* ---------------------------
   BPM +
---------------------------- */

$("tempoPlus").onclick=()=>{

$("tempo").value=
Math.min(
220,
parseInt(
$("tempo").value||100
)+5
);

if(metroRunning){

stopMetro();

startMetro();

}

};


/* ---------------------------
   메트로놈 버튼
---------------------------- */

$("metro").onclick=async()=>{

if(metroRunning){

stopMetro();

return;

}


try{

/*
 이 함수 호출은
 반드시 실제 iPhone 터치에서 실행된다.
*/

await ensureAudio();

startMetro();

}catch(e){

$("status").textContent=
"메트로놈 버튼을 한 번 더 눌러주세요.";

}

};


/* ---------------------------
   초기 화면
---------------------------- */

generate();

</script>

</body>
</html>
