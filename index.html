<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>MJ 도수 초견 트레이너</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f7f7f7;
    color:#111;
    font-family:Arial,"Noto Sans KR",sans-serif;
}

.wrap{
    max-width:900px;
    margin:0 auto;
    padding:28px 18px 40px;
}

h1{
    font-size:28px;
    margin:0 0 6px;
    font-weight:800;
}

.sub{
    color:#666;
    margin-bottom:24px;
}

.panel{
    background:#fff;
    border:1px solid #ddd;
    border-radius:18px;
    padding:20px;
}

.controls{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-bottom:18px;
}

label{
    font-size:13px;
    color:#666;
    display:block;
    margin-bottom:6px;
}

select,
input,
button{
    font:inherit;
}

select,
input[type=number]{
    width:100%;
    height:44px;
    border:1px solid #ccc;
    border-radius:10px;
    padding:0 12px;
    background:#fff;
}

button{
    border:0;
    border-radius:11px;
    height:46px;
    padding:0 18px;
    font-weight:700;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
}

.primary{
    background:#111;
    color:#fff;
}

.secondary{
    background:#eee;
    color:#111;
}

.keyline{
    text-align:center;
    margin:10px 0 16px;
}

.key{
    font-size:22px;
    font-weight:800;
}

.status{
    text-align:center;
    color:#666;
    min-height:24px;
    font-size:14px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin:18px 0;
}

.bar{
    height:150px;
    background:#fafafa;
    border:1px solid #d8d8d8;
    border-radius:12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
}

.bar:before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:4px;
    background:#111;
}

.num{
    position:absolute;
    top:10px;
    left:14px;
    font-size:12px;
    color:#999;
}

.chord{
    font-size:27px;
    font-weight:800;
}

.hidden .chord{
    visibility:hidden;
}

.hidden .bar{
    background:#eee;
}

.hidden .bar:before{
    background:#bbb;
}

.hidden .num{
    visibility:hidden;
}

.actions{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
}

.big{
    min-width:180px;
}

.metronome{
    margin-top:18px;
    padding-top:18px;
    border-top:1px solid #eee;
    text-align:center;
}

.beat{
    font-size:30px;
    font-weight:800;
    letter-spacing:8px;
    margin:8px 0 12px;
}

.beat span{
    opacity:.18;
}

.beat span.active{
    opacity:1;
}

.note{
    font-size:13px;
    color:#777;
    line-height:1.6;
    margin-top:14px;
}

.count{
    font-size:48px;
    font-weight:900;
    text-align:center;
    height:58px;
}

@media(max-width:650px){

    .wrap{
        padding:20px 12px 30px;
    }

    h1{
        font-size:23px;
    }

    .controls{
        grid-template-columns:1fr 1fr;
    }

    .grid{
        grid-template-columns:repeat(2,1fr);
    }

    .bar{
        height:125px;
    }

    .chord{
        font-size:22px;
    }

    .actions button{
        width:100%;
    }

    .big{
        min-width:0;
    }
}
</style>
</head>


<body>

<div class="wrap">

<h1>MJ 도수 초견 트레이너</h1>

<div class="sub">
랜덤 4마디 · 암기 · 도수 숨김 · 메트로놈 연주
</div>


<div class="panel">

<div class="controls">

<div>

<label>난이도</label>

<select id="level">

<option value="basic">
중급
</option>

<option value="advanced" selected>
중상급
</option>

<option value="hard">
상급
</option>

</select>

</div>


<div>

<label>템포 (BPM)</label>

<input
id="tempo"
type="number"
min="40"
max="220"
value="100"
>

</div>


<div>

<label>암기 시간</label>

<select id="seconds">

<option value="5">5초</option>
<option value="10" selected>10초</option>
<option value="15">15초</option>
<option value="20">20초</option>
<option value="25">25초</option>
<option value="30">30초</option>
<option value="35">35초</option>
<option value="40">40초</option>
<option value="45">45초</option>
<option value="50">50초</option>
<option value="55">55초</option>
<option value="60">60초</option>

</select>

</div>


<div>

<label>키</label>

<select id="keyMode">

<option value="random" selected>
랜덤 12키
</option>

<option value="fixed">
직접 선택
</option>

</select>


<select
id="fixedKey"
style="display:none;margin-top:6px"
>

<option>Bb</option>
<option>C</option>
<option>Db</option>
<option>D</option>
<option>Eb</option>
<option>E</option>
<option>F</option>
<option>Gb</option>
<option>G</option>
<option>Ab</option>
<option>A</option>
<option>B</option>

</select>

</div>

</div>


<div class="keyline">

KEY
<span class="key" id="key">Bb</span>

</div>


<div class="status" id="status">
새로운 진행을 생성하세요.
</div>


<div class="count" id="count"></div>


<div class="grid" id="grid"></div>


<div class="actions">

<button
class="primary big"
id="start"
>
새 문제 + 카운트
</button>


<button
class="secondary big"
id="show"
>
도수 다시 보기
</button>


<button
class="secondary"
id="tempoMinus"
>
BPM −5
</button>


<button
class="secondary"
id="tempoPlus"
>
BPM +5
</button>

</div>


<div class="metronome">

<div style="font-weight:700">
METRONOME
</div>


<div class="beat" id="beats">

<span>1</span>
<span>2</span>
<span>3</span>
<span>4</span>

</div>


<button
class="primary"
id="metro"
>
메트로놈 시작
</button>

</div>


<div class="note">

• 문제를 생성하면 먼저 4마디 도수를 확인합니다.<br>
• 카운트가 끝나면 도수가 자동으로 사라집니다.<br>
• 메트로놈에 맞춰 연주합니다.<br>
• 모바일에서도 사용할 수 있습니다.

</div>

</div>

</div>


<script>

/* =========================
   문제 데이터
========================= */

const keys = [
    "C","Db","D","Eb","E","F",
    "Gb","G","Ab","A","Bb","B"
];


const pools = {

    basic:[
        "I",
        "IIM7",
        "IIm7",
        "III7",
        "IIIm7",
        "IVM7",
        "V7",
        "VIm7",
        "VIIø7",
        "bVIIM7"
    ],

    advanced:[
        "I",
        "IM7",
        "IIm7",
        "II7",
        "IIIM7",
        "III7",
        "IVM7",
        "IVm7",
        "V7",
        "VIm7",
        "VI7",
        "VIIø7",
        "bII7",
        "bVIIM7",
        "bVI7",
        "bVII7",
        "bIII7"
    ],

    hard:[
        "I",
        "IM7",
        "IIm7",
        "II7",
        "IIø7",
        "IIIM7",
        "III7",
        "IVM7",
        "IVm7",
        "IV7",
        "V7",
        "V7(b9)",
        "V7(#9)",
        "VIm7",
        "VI7",
        "VIIø7",
        "bII7",
        "bIIIM7",
        "bVI7",
        "bVIIM7",
        "bVII7",
        "bVIIIM7"
    ]

};


/* =========================
   변수
========================= */

let current = [];

let timer = null;

let audioCtx = null;

let metroTimer = null;

let metroRunning = false;

let beat = 0;


/* =========================
   DOM
========================= */

const $ = id => document.getElementById(id);


/* =========================
   랜덤
========================= */

function randomItem(array){

    return array[
        Math.floor(
            Math.random() * array.length
        )
    ];

}


/* =========================
   문제 생성
========================= */

function generate(){

    let mode = $("keyMode").value;

    let key;

    if(mode === "random"){

        key = randomItem(keys);

    }else{

        key = $("fixedKey").value;

    }


    $("key").textContent = key;


    let pool =
        pools[$("level").value];


    current = [];


    for(let i=0;i<4;i++){

        current.push(
            randomItem(당구)
        );

    }


    render();


    $("status").textContent =
        "새로운 문제가 생성되었습니다.";

}


/* =========================
   화면 출력
========================= */

function render(){

    $("grid").innerHTML = "";


    for(let i=0;i<current.length;i++){

        let box =
            document.createElement("div");


        box.className = "bar";


        box.innerHTML =
            '<div class="num">' +
            (i+1) +
            '마디</div>' +

            '<div class="chord">' +
            current[i] +
            '</div>';


        $("grid").appendChild(box);

    }


    $("grid").classList.remove("hidden");

    $("count").textContent = "";

}


/* =========================
   숨기기
========================= */

function hide(){

    $("grid").classList.add("hidden");

}


/* =========================
   문제 시작
========================= */

function startProblem(){

    clearInterval(timer);


    generate();


    let seconds =
        parseInt(
            $("seconds").value,
            10
        );


    $("count").textContent =
        seconds;


    $("status").textContent =
        "진행을 암기하세요.";


    timer = setInterval(function(){

        seconds--;


        if(seconds > 0){

            $("count").textContent =
                seconds;

        }else{

            clearInterval(timer);

            $("count").textContent = "";

            hide();


            /*
             이미 오디오가 활성화되어 있기 때문에
             여기서는 단순히 메트로놈만 시작한다.
            */

            if(startMetronome()){

                $("status").textContent =
                    "도수가 숨겨졌습니다. 메트로놈이 시작됩니다.";

            }

        }

    },1000);

}


/* =========================
   다시 보기
========================= */

function showProblem(){

    clearInterval(timer);

    $("count").textContent = "";

    render();

    $("status").textContent =
        "도수를 다시 확인할 수 있습니다.";

}


/* =========================
   iPhone 오디오 활성화
========================= */

function unlockAudio(){

    return new Promise(function(resolve,reject){

        try{

            const AudioContextClass =
                window.AudioContext ||
                window.webkitAudioContext;


            if(!AudioContextClass){

                reject(
                    new Error(
                        "Web Audio를 지원하지 않습니다."
                    )
                );

                return;

            }


            /*
             최초 버튼 클릭 때만 생성
            */

            if(!audioCtx){

                audioCtx =
                    new AudioContextClass();

            }


            /*
             iPhone Safari가 suspended라면
             사용자 클릭 안에서 resume
            */

            if(
                audioCtx.state === "suspended"
            ){

                audioCtx.resume()
                .then(function(){

                    playUnlockSound();

                    resolve();

                })
                .catch(reject);


            }else{

                playUnlockSound();

                resolve();

            }

        }catch(error){

            reject(error);

        }

    });

}


/* =========================
   오디오 잠금 해제용
========================= */

function playUnlockSound(){

    if(!audioCtx) return;


    let oscillator =
        audioCtx.createOscillator();


    let gain =
        audioCtx.createGain();


    oscillator.type = "sine";

    oscillator.frequency.value = 440;


    gain.gain.value = 0.00001;


    oscillator.connect(gain);

    gain.connect(
        audioCtx.destination
    );


    let now =
        audioCtx.currentTime;


    oscillator.start(now);

    oscillator.stop(
        now + 0.05
    );

}


/* =========================
   메트로놈 소리
========================= */

function playClick(accent){

    if(!audioCtx) return;


    /*
     혹시 Safari가 잠깐 suspended되었다면
     소리를 내지 않는다.
    */

    if(audioCtx.state !== "running"){
        return;
    }


    let oscillator =
        audioCtx.createOscillator();


    let gain =
        audioCtx.createGain();


    let now =
        audioCtx.currentTime;


    oscillator.type = "sine";


    if(accent){

        oscillator.frequency.value = 1200;

    }else{

        oscillator.frequency.value = 800;

    }


    gain.gain.setValueAtTime(
        0.0001,
        now
    );


    gain.gain.exponentialRampToValueAtTime(
        accent ? 0.25 : 0.18,
        now + 0.005
    );


    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 0.07
    );


    oscillator.connect(gain);

    gain.connect(
        audioCtx.destination
    );


    oscillator.start(now);

    oscillator.stop(
        now + 0.075
    );

}


/* =========================
   박자 표시
========================= */

function showBeat(){

    let spans =
        $("beats")
        .querySelectorAll("span");


    spans.forEach(function(span,index){

        if(index === beat){

            span.classList.add("active");

        }else{

            span.classList.remove("active");

        }

    });


    beat++;

    if(beat >= 4){

        beat = 0;

    }

}


/* =========================
   메트로놈 시작
========================= */

function startMetronome(){

    if(!audioCtx){

        $("status").textContent =
            "메트로놈 버튼을 눌러주세요.";

        return false;

    }


    if(audioCtx.state !== "running"){

        $("status").textContent =
            "메트로놈 버튼을 한 번 눌러주세요.";

        return false;

    }


    clearInterval(metroTimer);


    let bpm =
        parseInt(
            $("tempo").value,
            10
        );


    if(!bpm || bpm < 40){

        bpm = 40;

    }


    if(bpm > 220){

        bpm = 220;

    }


    let interval =
        60000 / bpm;


    metroRunning = true;

    beat = 0;


    $("metro").textContent =
        "메트로놈 정지";


    /*
     첫 박자
    */

    playClick(true);

    showBeat();


    /*
     이후 반복
    */

    metroTimer =
        setInterval(function(){

            playClick(
                beat === 0
            );

            showBeat();

        },interval);


    return true;

}


/* =========================
   메트로놈 정지
========================= */

function stopMetronome(){

    clearInterval(metroTimer);

    metroTimer = null;

    metroRunning = false;


    $("metro").textContent =
        "메트로놈 시작";


    $("beats")
        .querySelectorAll("span")
        .forEach(function(span){

            span.classList.remove(
                "active"
            );

        });

}


/* =========================
   키 선택
========================= */

$("keyMode").addEventListener(
    "change",
    function(){

        if(
            $("keyMode").value === "fixed"
        ){

            $("fixedKey").style.display =
                "block";

        }else{

            $("fixedKey").style.display =
                "none";

        }

    }
);


/* =========================
   새 문제 버튼
========================= */

$("start").addEventListener(
    "click",
    function(){

        /*
         중요:
         iPhone에서는 이 클릭 순간
         AudioContext를 활성화한다.
        */

        unlockAudio()

        .then(function(){

            startProblem();

        })

        .catch(function(){

            $("status").textContent =
                "오디오를 활성화할 수 없습니다.";

        });

    }
);


/* =========================
   다시 보기
========================= */

$("show").addEventListener(
    "click",
    function(){

        showProblem();

    }
);


/* =========================
   BPM -
========================= */

$("tempoMinus").addEventListener(
    "click",
    function(){

        let bpm =
            parseInt(
                $("tempo").value,
                10
            ) || 100;


        bpm -= 5;


        if(bpm < 40){

            bpm = 40;

        }


        $("tempo").value = bpm;


        if(metroRunning){

            stopMetronome();

            startMetronome();

        }

    }
);


/* =========================
   BPM +
========================= */

$("tempoPlus").addEventListener(
    "click",
    function(){

        let bpm =
            parseInt(
                $("tempo").value,
                10
            ) || 100;


        bpm += 5;


        if(bpm > 220){

            bpm = 220;

        }


        $("tempo").value = bpm;


        if(metroRunning){

            stopMetronome();

            startMetronome();

        }

    }
);


/* =========================
   메트로놈 버튼
========================= */

$("metro").addEventListener(
    "click",
    function(){

        /*
         iPhone에서는 이 버튼 자체가
         사용자 제스처이므로 여기서
         AudioContext를 활성화한다.
        */

        if(metroRunning){

            stopMetronome();

            return;

        }


        unlockAudio()

        .then(function(){

            startMetronome();

        })

        .catch(function(){

            $("status").textContent =
                "메트로놈을 다시 눌러주세요.";

        });

    }
);


/* =========================
   초기 실행
========================= */

generate();

</script>

</body>
</html>
